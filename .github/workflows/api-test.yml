name: api test

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-test.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
